name: Deploy Rhythm Game Lab
# Trigger deployment after enabling GitHub Pages Actions source.
on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'overrides/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg for precise 60-second audio editing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble website package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat package/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rhythm-lab-site.zip
          unzip -q /tmp/rhythm-lab-site.zip -d _site
          # Apply chart-only overrides; keep both recorded audio tracks unchanged.
          base64 --decode overrides/charts/moonlight-hard-piano-groove-v2.json.gz.b64 | gzip -dc > _site/assets/charts/moonlight-hard.json
          echo '834b4eb8fa4d43822dd287bab1b7fd9581f1ca6c6624d1b6aaa0260612f5eb97  _site/assets/charts/moonlight-hard.json' | sha256sum -c -
          # EASY emphasizes 15 recurring arpeggio-to-two-accent motifs from the 124 BPM arranged MIDI.
          base64 --decode overrides/charts/moonlight-easy-signature-motif-v3.json.gz.b64 | gzip -dc > _site/assets/charts/moonlight-easy.json
          echo 'e6789fc545e283a980cd8a36e54bbf8396ed2e88295d62d8666aeaac687d06af  _site/assets/charts/moonlight-easy.json' | sha256sum -c -
          python3 -c "import json; p=json.load(open('_site/assets/charts/moonlight-easy.json')); a=p['notes']; assert p['schemaVersion']==1 and len(a)==334 and all(n['kind']!='flick' or n['lane'] in (0,3) for n in a)"
          # During auto-demo, do not mask piano phrases with a low-frequency thump on every note.
          python3 -c "from pathlib import Path; p=Path('_site/scripts/main.js'); s=p.read_text(); old='registerSuccess(n,0,true);playHit(n.pitch,n.kind);'; assert old in s; p.write_text(s.replace(old,'registerSuccess(n,0,true);if(n.pitch<50)playHit(n.pitch,n.kind);'))"
          python3 -c "import json; p=json.load(open('_site/assets/charts/moonlight-hard.json')); assert p['schemaVersion']==1 and len(p['notes'])==463"
          # Install new 224 kbps audio mixes and the motif-aware HARD 50:50 chart, preserving MIDI-aligned timing.
          cat overrides/audio-piano-forward-v2/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/moonlight-piano-forward-v5.zip
          echo '1c97e68f4ef77d15060eee91e52bb9dff3aa758f38374a64ea68b69f17fcf57c  /tmp/moonlight-piano-forward-v5.zip' | sha256sum -c -
          unzip -o -q /tmp/moonlight-piano-forward-v5.zip -d _site
          echo '1de0c62dfec782880b5dbcf519d595cc3ea8f56e17a7d5f5101de839af4e446b  _site/assets/audio/moonlight-easy-epic-rock.mp3' | sha256sum -c -
          echo 'c615aa603e59cc7a1a325edd90932982752d1c0830bd3b711fea9ed5b1828fec  _site/assets/audio/moonlight-hard-epic-rock.mp3' | sha256sum -c -
          echo '6022ecf36e3f3d6fce912b197afecddb41c070128829b15df7358a52a0737319  _site/assets/charts/moonlight-hard.json' | sha256sum -c -
          python3 -c "import json; p=json.load(open('_site/assets/charts/moonlight-hard.json')); a=p['notes']; assert p['schemaVersion']==1 and len(a)==535 and sum(n['kind']=='flick' for n in a)==21"
          mv _site/assets/audio/moonlight-easy-epic-rock.mp3 _site/assets/audio/moonlight-easy-piano-mix-v5.mp3
          mv _site/assets/audio/moonlight-hard-epic-rock.mp3 _site/assets/audio/moonlight-hard-piano-mix-v5.mp3
          # V6: dynamic phrase-following mix with audible bass, softer percussion, and a resolved final chord.
          cat overrides/dynamic-mix-v6/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/moonlight-dynamic-v6.zip
          echo '215580a473e2886d3224e1cbe2248694284eec4b06bc8347b40418feb5ed27e0  /tmp/moonlight-dynamic-v6.zip' | sha256sum -c -
          unzip -o -q /tmp/moonlight-dynamic-v6.zip -d _site
          echo '2c24cdf3cb3d167eeaa8313cf3f537a008c6e1ec2fc0b1d062c78e7eeb62de69  _site/assets/audio/moonlight-easy-dynamic-v6.mp3' | sha256sum -c -
          echo '349fcf18f4c0887e8aaacdcb1c5c0310c21aa81a42246ab9b076b247a690172a  _site/assets/audio/moonlight-hard-dynamic-v6.mp3' | sha256sum -c -
          # Auto demo should only highlight the visual beat, not add a competing kick to every note.
          python3 -c "from pathlib import Path; p=Path('_site/scripts/main.js'); s=p.read_text(); old='registerSuccess(n,0,true);if(n.pitch<50)playHit(n.pitch,n.kind);'; assert old in s; s=s.replace(old,'registerSuccess(n,0,true);'); assert 'offset=0,fxVol=.45,songVol=.85' in s; s=s.replace('offset=0,fxVol=.45,songVol=.85','offset=0,fxVol=.28,songVol=.88'); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('_site/index.html'); s=p.read_text(); assert 'id=\"fxText\">45%' in s; s=s.replace('id=\"fxText\">45%','id=\"fxText\">28%'); assert 'id=\"fxVolume\"' in s; s=s.replace('id=\"fxVolume\" max=\"100\" min=\"0\" type=\"range\" value=\"45\"','id=\"fxVolume\" max=\"100\" min=\"0\" type=\"range\" value=\"28\"'); s=s.replace('id=\"songText\">85%','id=\"songText\">88%'); s=s.replace('id=\"songVolume\" max=\"100\" min=\"0\" type=\"range\" value=\"85\"','id=\"songVolume\" max=\"100\" min=\"0\" type=\"range\" value=\"88\"'); p.write_text(s)"
          # Invalidate stale browser-local chart overrides; versioned filenames avoid cached old music.
          python3 -c "import json; from pathlib import Path; p=Path('_site/assets/manifest.json'); m=json.loads(p.read_text()); m['version']='1.3.0'; t=[x for x in m['tracks'] if x.get('status')=='ready']; assert len(t)==2; t[0]['audio']='assets/audio/moonlight-easy-dynamic-v6.mp3'; t[1]['audio']='assets/audio/moonlight-hard-dynamic-v6.mp3'; [x.update(subtitle=x['subtitle']+' · DYNAMIC MIX V6') for x in t]; p.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')"
          test -f _site/index.html
          test -f _site/scripts/main.js
          test -f _site/assets/audio/moonlight-easy-dynamic-v6.mp3
          test -f _site/assets/audio/moonlight-hard-dynamic-v6.mp3
          test -f _site/assets/charts/moonlight-easy.json
          test -f _site/assets/charts/moonlight-hard.json
          touch _site/.nojekyll
          # Keep a separate EASY V7 preview as a fallback; main site's EASY also receives V7.
          mkdir -p /tmp/rhythm-easy-v7
          cat overrides/easy-v7/patch.zip.b64 | tr -d '\n\r' | base64 --decode > /tmp/rhythm-easy-v7.zip
          echo 'd7503f4d0f0ec3af7eded76dfa0eabe696022e085f1089562e187edb96f1c75e  /tmp/rhythm-easy-v7.zip' | sha256sum -c -
          unzip -q /tmp/rhythm-easy-v7.zip -d /tmp/rhythm-easy-v7
          # V8 short arrangement, beatmap synchronization and approved energy rebalance.
          python3 overrides/short-v8/build_short_v8.py
          # V9: show the actual health as a quiet 5px bar; no numbers or labels.
          python3 overrides/easy-v7/add_energy_bar.py /tmp/rhythm-easy-v7/easy-v7-addon.js
          python3 overrides/note-sound-v11/apply_note_sound.py
          python3 overrides/note-sound-v11/probe.py
          test -s _site/assets/audio/moonlight-easy-short-v8.mp3
          test -s _site/assets/audio/moonlight-hard-short-v8.mp3
          mkdir -p _site/preview/easy-v7/scripts _site/preview/easy-v7/assets/charts _site/preview/easy-v7/assets/icons
          cp _site/index.html _site/preview/easy-v7/index.html
          cp _site/scripts/main.js _site/preview/easy-v7/scripts/main.js
          cp _site/assets/charts/moonlight-easy.json _site/preview/easy-v7/assets/charts/moonlight-easy.json
          cp _site/manifest.webmanifest _site/preview/easy-v7/manifest.webmanifest
          cp _site/assets/icons/* _site/preview/easy-v7/assets/icons/
          cp /tmp/rhythm-easy-v7/easy-v7-addon.js _site/preview/easy-v7/scripts/easy-v7-addon.js
          cp /tmp/rhythm-easy-v7/easy-v7-theme.css _site/preview/easy-v7/scripts/easy-v7-theme.css
          cp overrides/easy-v7/energy-meter.css _site/preview/easy-v7/scripts/energy-meter.css
          cp /tmp/rhythm-easy-v7/README_TEST.txt _site/preview/easy-v7/README_TEST.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('_site/preview/easy-v7')
          p=d/'index.html'
          s=p.read_text(encoding='utf-8')
          head='</style>'
          script='<script defer="" src="scripts/main.js"></script>'
          assert head in s and script in s
          s=s.replace(head,head+'<link rel="stylesheet" href="scripts/easy-v7-theme.css"/><link rel="stylesheet" href="scripts/energy-meter.css?v10"/>')
          s=s.replace(script,script+'<script defer src="scripts/easy-v7-addon.js?v11"></script>')
          s=s.replace('src="scripts/main.js"','src="scripts/main.js?v11"')
          s=s.replace('href="scripts/easy-v7-theme.css"','href="scripts/easy-v7-theme.css?v8"')
          p.write_text(s,encoding='utf-8')
          src=Path('_site/assets/manifest.json')
          m=json.loads(src.read_text(encoding='utf-8'))
          m['version']='2.2.0-easy-v11-preview'
          m['tracks']=[t for t in m['tracks'] if t.get('id')=='moonlight_intro_rock_v4_3' and t.get('status')=='ready']
          assert len(m['tracks'])==1
          t=m['tracks'][0]
          t['audio']='../../assets/audio/moonlight-easy-short-v8.mp3'
          t['chart']='assets/charts/moonlight-easy.json'
          t['subtitle']='SIGNATURE PIANO · EASY ★★★ · V8 60s PLAYTEST'
          (d/'assets/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          ch=json.loads((d/'assets/charts/moonlight-easy.json').read_text())
          assert 75 <= len(ch['notes']) <= 350, 'V8 preview must use synchronized shortened chart'
          assert Path('_site/assets/audio/moonlight-easy-short-v8.mp3').is_file()
          PY
          test -f _site/preview/easy-v7/scripts/easy-v7-addon.js
          test -f _site/preview/easy-v7/assets/manifest.json
          # Main shortcut URL: apply V7 only to EASY while keeping the existing HARD engine.
          cp /tmp/rhythm-easy-v7/easy-v7-theme.css _site/scripts/easy-v7-theme.css
          cp overrides/easy-v7/energy-meter.css _site/scripts/energy-meter.css
          python3 overrides/easy-v7/root_adapter_patch.py /tmp/rhythm-easy-v7/easy-v7-addon.js _site/scripts/easy-v7-addon.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          script='<script defer="" src="scripts/main.js"></script>'
          assert s.count('</style>')==1 and s.count(script)==1
          s=s.replace('</style>','</style><link id="v7Theme" rel="stylesheet" href="scripts/easy-v7-theme.css" disabled/><link rel="stylesheet" href="scripts/energy-meter.css?v10"/>',1)
          s=s.replace(script,script+'<script defer src="scripts/easy-v7-addon.js?v11"></script>',1)
          s=s.replace('src="scripts/main.js"','src="scripts/main.js?v11"',1)
          s=s.replace('href="scripts/easy-v7-theme.css"','href="scripts/easy-v7-theme.css?v8"',1)
          p.write_text(s,encoding='utf-8')
          m=json.loads(Path('_site/assets/manifest.json').read_text(encoding='utf-8'))
          ready=[t for t in m['tracks'] if t.get('status')=='ready']
          assert len(ready)==2 and [t['difficulty'] for t in ready]==[3,5]
          assert 'easy-v7-addon.js' in s and 'v7Theme' in s
          PY
          test -s _site/scripts/easy-v7-addon.js
          test -s _site/scripts/easy-v7-theme.css
          test -s _site/scripts/energy-meter.css
          test -s _site/preview/easy-v7/scripts/energy-meter.css
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('_site/scripts/easy-v7-addon.js').read_text(encoding='utf-8')
          preview=Path('_site/preview/easy-v7/scripts/easy-v7-addon.js').read_text(encoding='utf-8')
          html=Path('_site/index.html').read_text(encoding='utf-8')
          assert root.count("id = 'v9HealthMeter'")==1 and preview.count("id = 'v9HealthMeter'")==1
          assert "hud.appendChild(v9Meter)" in root and "hud.appendChild(v9Meter)" in preview
          assert "insertAdjacentElement('afterend', v9Meter)" not in root
          meter_css=Path('_site/scripts/energy-meter.css').read_text(encoding='utf-8')
          assert "position: absolute" in meter_css and "flex: 0 0 5px" not in meter_css
          assert "_site/preview/easy-v7/scripts/energy-meter.css" in str(Path('_site/preview/easy-v7/scripts/energy-meter.css'))
          assert "meter.hidden=!easy" in root
          assert 'energy-meter.css?v10' in html
          assert 'easy-v7-addon.js?v11' in html
          assert 'main.js?v11' in html
          assert Path('_site/scripts/main.js').read_text().count("function playHit(sound,kind)")==1
          assert 'playHit(n.sound||n.pitch,n.kind)' in Path('_site/scripts/main.js').read_text()
          for mode in ['easy','hard']:
              ch=json.loads(Path('_site/assets/charts/moonlight-'+mode+'.json').read_text())
              assert ch['soundSchemaVersion']==1 and ch['notes']
              assert all(n['sound']['midi']==n['pitch'] for n in ch['notes'])
              assert all(len({n['pitch'] for n in ch['notes'] if n['lane']==lane})>=2 for lane in range(4))
          print('V10_HUD_OVERLAY_NO_REFLOW_VERIFIED')
          print('V11_SOUND_TAGS_AND_NOTE_PITCH_VERIFIED')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
