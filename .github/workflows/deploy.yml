name: Deploy Rhythm Game Lab
# Trigger deployment after enabling GitHub Pages Actions source.
on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble website package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat package/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/rhythm-lab-site.zip
          unzip -q /tmp/rhythm-lab-site.zip -d _site
          test -f _site/index.html
          test -f _site/scripts/main.js
          test -f _site/assets/audio/moonlight-easy-epic-rock.mp3
          test -f _site/assets/audio/moonlight-hard-epic-rock.mp3
          test -f _site/assets/charts/moonlight-easy.json
          test -f _site/assets/charts/moonlight-hard.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
